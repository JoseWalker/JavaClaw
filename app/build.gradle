plugins {
    id 'java-library'
    id 'org.springframework.boot'
    alias(libs.plugins.jib)
    alias(libs.plugins.vaadin)
}

dependencies {
    implementation platform(libs.bom.vaadin)
    implementation libs.vaadin.spring.boot.starter

    implementation project(':base')
    implementation project(':providers:anthropic')
    implementation project(':providers:google')
    implementation project(':providers:ollama')
    implementation project(':providers:openai')

    implementation project(':plugins:discord')
    implementation project(':plugins:telegram')
    implementation project(':plugins:playwright')
    implementation project(':plugins:brave')
    implementation project(':plugins:whatsapp')

    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation(libs.pebble.spring.starter)

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // The Vaadin BOM has to be imported a second time here. 'developmentOnly' does not extend
    // 'implementation', so the `implementation platform(libs.bom.vaadin)` import at the top of this
    // block never reaches it, and the versionless libs.vaadin.dev below then resolves to the empty
    // version and fails :app:bootJar with "Could not find com.vaadin:vaadin-dev:". The root
    // build.gradle re-imports the Spring Boot BOM onto this same configuration for the same reason.
    // Declaring a version on the artifact instead resolves to the same graph today, so the argument
    // for the BOM is not resolution but ownership: gradle/libs.versions.toml picks the Vaadin line
    // once, and the plugin, the starter and the dev tools all have to move together on an upgrade.
    developmentOnly platform(libs.bom.vaadin)
    // Vaadin 25 no longer ships the dev tools transitively; without this artifact the servlet
    // context listener aborts startup with "'vaadin-dev-server' not found." and the whole
    // application fails to boot in development mode. 'developmentOnly' is Vaadin's own prescribed
    // scope for it: Spring Boot puts the configuration on the runtime classpath for bootRun but
    // excludes it from bootJar, so the dev server never reaches a production image.
    developmentOnly libs.vaadin.dev
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation libs.spring.modulith.starter.test
    testImplementation libs.archunit.junit5
}

bootRun {
    workingDir = rootProject.projectDir
}

// ':app:javadoc' runs at Gradle's default member level, "protected", so it never looks at a
// private method, constructor or field. That makes it unable to observe most of what the coding
// standard asks for: deleting every private docblock in ai.javaclaw.chat.ui leaves ':app:javadoc'
// reporting exactly the same warning count, because at "protected" it generates pages for 11 of
// that package's 37 types and skips the rest. A check that stays green while the property it
// exists to protect is broken is worse than no check, so this task makes the strict measurement
// reproducible from a clean clone with one command instead of a locally pasted init script.
//
// It is registered as a separate task rather than folded into 'javadoc' deliberately. Raising the
// member level on 'javadoc' itself would change the output of everybody's build and immediately
// surface 122 warnings that predate any current change, in files unrelated to it. 'strictJavadoc'
// is additive: no task depends on it, './gradlew build' does not run it, and 'javadoc' keeps
// producing exactly what it produced before.
//
// It reports rather than enforces. Javadoc only fails a build on errors, and '-Werror' is not an
// option while the 122 pre-existing warnings are still there, so this task cannot yet be wired
// into a CI gate. Once those are cleaned up, adding '-Werror' here turns it into one without any
// other change.
//
// -Xmaxwarns and -Xmaxerrs are lifted past javac's default cap of 100 because the tool otherwise
// stops counting and prints a truncated "100 warnings", which would silently understate how much
// a regression actually broke.
tasks.register('strictJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Runs javadoc at PRIVATE member level, so private members are checked for documentation too.'
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/strict-javadoc').get().asFile
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addStringOption('Xmaxwarns', '10000')
    options.addStringOption('Xmaxerrs', '10000')
}

jib {
    to {
        image = 'jobrunr.io/javaclaw'
        tags = ['latest']
    }
    extraDirectories {
        paths {
            path {
                from = rootProject.file('workspace')
                into = '/workspace'
            }
            permissions = [
                    '/workspace': '755'
            ]
        }
    }
}
