spring:
  application:
    name: JavaClaw
  config:
    import: optional:classpath:application.private.yaml
  datasource:
    url: jdbc:h2:file:./workspace/app
  ai:
    model:
      chat: unknown
      audio.speech: unknown
      audio.transcription: unknown
      embedding: unknown
      image: unknown
      moderation: unknown

management:
  endpoint:
    restart:
      enabled: true

vaadin:
  # Vaadin must not share a URL space with the existing Spring MVC pages. Left at the default /*,
  # its bootstrap request goes to the context root, where IndexController answers 302 -> /chat; the
  # client receives an htmx page instead of its init payload and reports "Connection lost" on every
  # route. Confining Vaadin to /ui/* keeps both UIs alive side by side during the migration.
  url-mapping: /ui/*
  # Without this Vaadin scans the whole classpath for routes and annotations, which measured 13.3s
  # of the startup on this project. Restricting the scan to our own packages is the fix Vaadin's own
  # startup warning recommends.
  allowed-packages: ai.javaclaw

pebble:
  suffix: .html.peb
agent:
  onboarding:
    completed: false
  workspace: file:./workspace/
  skills:
    paths: classpath:/META-INF/skills
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 1
  dashboard:
    enabled: true
    port: 8081
